name: Build, test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: |
            7.0.x
            8.0.x
      - uses: NuGet/setup-nuget@v4.0
      - uses: microsoft/setup-msbuild@v3
      - uses: nanoframework/nanobuild@v1
        with:
          gitHubAuth: ${{ github.token }}

      - name: Determine package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = "1.0.0-ci.${{ github.run_number }}"
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH[-prerelease].'
            }
            $version = $env:REF_NAME.Substring(1)
          }
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore nanoFramework packages
        run: |
          Get-ChildItem -Path . -Filter '*.nfproj' -Recurse -File | ForEach-Object {
            nuget restore (Join-Path $_.DirectoryName 'packages.config') -PackagesDirectory packages -NonInteractive
            if ($LASTEXITCODE -ne 0) { throw "Restore failed for $($_.Name)." }
          }

      - name: Build .NET projects
        run: |
          dotnet build DecoderHelper\DecoderHelper.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build DotnetLegoBluetoothTest\DotnetLegoBluetoothTest.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build nanoFramework projects
        run: |
          Get-ChildItem -Path . -Filter '*.nfproj' -Recurse -File | ForEach-Object {
            msbuild $_.FullName /t:Rebuild /p:Configuration=Release /verbosity:minimal /nologo
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $($_.Name)." }
          }

      - name: Run .NET tests
        run: dotnet test DotnetLegoBluetoothTest\DotnetLegoBluetoothTest.csproj --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Test dependency updater
        run: .\.github\scripts\Test-UpdateNanoFrameworkDependencies.ps1

      - name: Create NuGet packages
        run: |
          dotnet pack LegoBluetoothDotnet\LegoBluetoothDotnet.csproj --configuration Release --no-build -p:PackageVersion=$env:PACKAGE_VERSION --output artifacts\packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.github\scripts\Pack-NanoFramework.ps1 -Version $env:PACKAGE_VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nuget-packages
          path: artifacts\packages\*.nupkg
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results
          path: TestResults\*.trx
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    environment: nuget
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-packages
          path: artifacts\packages
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 8.0.x
      - name: Publish to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) {
            throw 'Configure the NUGET_API_KEY secret before publishing.'
          }
          Get-ChildItem artifacts\packages\*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing failed for $($_.Name)." }
          }
