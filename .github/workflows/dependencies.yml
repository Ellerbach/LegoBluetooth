name: Update nanoFramework dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanoframework-dependency-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check automation token
        shell: pwsh
        env:
          DEPENDENCY_UPDATE_TOKEN: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DEPENDENCY_UPDATE_TOKEN)) {
            throw 'Configure DEPENDENCY_UPDATE_TOKEN so dependency pull requests can trigger CI.'
          }
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
      - name: Update package versions and reference paths
        shell: pwsh
        run: .\.github\scripts\Update-NanoFrameworkDependencies.ps1
      - uses: peter-evans/create-pull-request@v8.1.3
        with:
          token: ${{ secrets.DEPENDENCY_UPDATE_TOKEN }}
          branch: automation/nanoframework-dependencies
          delete-branch: true
          title: Update nanoFramework dependencies
          commit-message: Update nanoFramework dependencies
          body: |
            Weekly stable NuGet updates for nanoFramework projects.
            Updates packages.config and matching .nfproj reference paths together.
            Review CI results and firmware compatibility before merging.
          add-paths: |
            **/packages.config
            **/*.nfproj
